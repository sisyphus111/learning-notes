<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1050" role="img" aria-labelledby="title desc"><title id="title">FlashAttention 3 与 4 的依赖和存储位置</title><desc id="desc">两块面板对比 Hopper FA3 和 Blackwell SM100 FA4。TMA 生产者搬运 tile，矩阵计算和 softmax 之间保持数据依赖；不同 tile 的加载与计算可重叠。FA3 的 MMA 累加器在寄存器，FA4 的累加器在 TMEM，非矩阵操作需要数据交换。这是逻辑示意，不是实测时间线。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<style>
:root{--fg:#26364e;--muted:#5b6b80;--paper:white;--wash:#f8fafc;--line:#d4dce8;--blue:#285da8;--blue-bg:#eef4fd;--green:#328a59;--green-bg:#eef8f1;--orange:#b47a41;--orange-bg:#fff6ec;--arrow:#64748b}
@media(prefers-color-scheme:dark){:root{--fg:#e8e8e8;--muted:#b6b6b6;--paper:#191919;--wash:#252525;--line:#454545;--blue:#9dc8f5;--blue-bg:#1d2936;--green:#a8d7bb;--green-bg:#1e2c24;--orange:#dfbc8c;--orange-bg:#30291e;--arrow:#a3a3a3}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:24px}.title{font-size:29px;font-weight:650}.label{font-size:25px;font-weight:600}.small{font-size:22px;fill:var(--muted)}.flow{fill:none;stroke:var(--arrow);stroke-width:2;marker-end:url(#arrow)}.panel{fill:var(--wash);stroke:var(--line);stroke-width:1.5}.input{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.compute{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.storage{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.5}
</style>
<rect width="1040" height="1050" rx="12" fill="var(--paper)"/>
<text x="28" y="44" class="title" text-anchor="start">异步流水线：保持依赖，让不同任务重叠</text>
<text x="28" y="84" class="small" text-anchor="start">逻辑示意，非实测时间线；同一 tile 的 QK → softmax → PV 仍有依赖。</text>
<rect x="24" y="112" width="992" height="421" rx="8" class="panel"/>
<text x="46" y="152" class="label" text-anchor="start">FA3 · Hopper SM90</text>
<rect x="48" y="178" width="944" height="68" rx="8" class="input"/>
<text x="74" y="220" class="" text-anchor="start">producer：发起 TMA → shared memory 中的 Q / K / V tile</text>
<text x="74" y="279" class="small" text-anchor="start">数据到达后才能消费；消费者读完后才能复用缓冲槽。</text>
<rect x="48" y="305" width="225" height="119" rx="8" class="compute"/>
<text x="160.5" y="339" class="label" text-anchor="middle">QᵢKⱼᵀ</text>
<text x="160.5" y="376" class="small" text-anchor="middle">WGMMA</text>
<text x="160.5" y="409" class="small" text-anchor="middle">Sⱼ：寄存器</text>
<rect x="386" y="305" width="268" height="119" rx="8" class="storage"/>
<text x="520.0" y="339" class="label" text-anchor="middle">按行更新</text>
<text x="520.0" y="376" class="small" text-anchor="middle">m、l、P̃ⱼ：寄存器</text>
<text x="520.0" y="409" class="small" text-anchor="middle">指数、归约、缩放</text>
<rect x="767" y="305" width="225" height="119" rx="8" class="compute"/>
<text x="879.5" y="339" class="label" text-anchor="middle">P̃ⱼVⱼ</text>
<text x="879.5" y="376" class="small" text-anchor="middle">WGMMA</text>
<text x="879.5" y="409" class="small" text-anchor="middle">u：寄存器</text>
<path d="M273 362 H386" class="flow"/>
<text x="330" y="344" class="small" text-anchor="middle">Sⱼ</text>
<path d="M654 362 H767" class="flow"/>
<text x="711" y="344" class="small" text-anchor="middle">P̃ⱼ</text>
<text x="48" y="468" class="small" text-anchor="start">producer 与 consumer 分工；多个 consumer warpgroup 可交错工作。</text>
<text x="48" y="506" class="small" text-anchor="start">跨 tile 安排 GEMM / softmax 重叠；额外状态会增加寄存器压力。</text>
<rect x="24" y="562" width="992" height="421" rx="8" class="panel"/>
<text x="46" y="602" class="label" text-anchor="start">FA4 · Blackwell SM100</text>
<rect x="48" y="628" width="944" height="68" rx="8" class="input"/>
<text x="74" y="670" class="" text-anchor="start">producer：发起 TMA → shared memory 中的 Q / K / V tile</text>
<text x="74" y="729" class="small" text-anchor="start">数据到达后才能消费；消费者读完后才能复用缓冲槽。</text>
<rect x="48" y="755" width="225" height="119" rx="8" class="compute"/>
<text x="160.5" y="789" class="label" text-anchor="middle">QᵢKⱼᵀ</text>
<text x="160.5" y="826" class="small" text-anchor="middle">tcgen05 MMA</text>
<text x="160.5" y="859" class="small" text-anchor="middle">Sⱼ：TMEM</text>
<rect x="386" y="755" width="268" height="119" rx="8" class="storage"/>
<text x="520.0" y="789" class="label" text-anchor="middle">按行更新</text>
<text x="520.0" y="826" class="small" text-anchor="middle">softmax / correction</text>
<text x="520.0" y="859" class="small" text-anchor="middle">指数、归约、缩放</text>
<rect x="767" y="755" width="225" height="119" rx="8" class="compute"/>
<text x="879.5" y="789" class="label" text-anchor="middle">P̃ⱼVⱼ</text>
<text x="879.5" y="826" class="small" text-anchor="middle">tcgen05 MMA</text>
<text x="879.5" y="859" class="small" text-anchor="middle">u：TMEM</text>
<path d="M273 812 H386" class="flow"/>
<text x="330" y="794" class="small" text-anchor="middle">Sⱼ</text>
<path d="M654 812 H767" class="flow"/>
<text x="711" y="794" class="small" text-anchor="middle">P̃ⱼ</text>
<text x="48" y="918" class="small" text-anchor="start">MMA 累加器移入 TMEM；softmax 与输出修正仍需寄存器运算。</text>
<text x="48" y="956" class="small" text-anchor="start">通过分工和缓冲重叠不同 tile 的任务；TMEM ↔ 寄存器也有成本。</text>
<text x="28" y="1034" class="small" text-anchor="start">箭头表达当前 tile 的依赖；可重叠的是不同 tile / warpgroup 中已就绪的任务。</text>
</svg>