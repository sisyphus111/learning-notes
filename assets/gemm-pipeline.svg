<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">加载与计算的重叠</title><desc id="desc">串行处理三块输入需交替加载与计算；双缓冲可让后续加载与当前计算重叠，两个槽交替复用。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<style>/* Embedded SVGs follow the embedding page's color-scheme, including manual toggles. */
:root{--fg:#26364e;--muted:#5b6b80;--paper:white;--wash:#f8fafc;--line:#d4dce8;--blue:#285da8;--blue-bg:#eef4fd;--green:#328a59;--green-bg:#eef8f1;--orange:#d9a46e;--orange-bg:#fff6ec;--empty:#f6f7f9;--arrow:#64748b}
@media(prefers-color-scheme:dark){:root{--fg:#e8e8e8;--muted:#b6b6b6;--paper:#191919;--wash:#252525;--line:#454545;--blue:#9dc8f5;--blue-bg:#1d2936;--green:#a8d7bb;--green-bg:#1e2c24;--orange:#dfbc8c;--orange-bg:#30291e;--empty:#252525;--arrow:#a3a3a3}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:23px}.title{font-size:28px;font-weight:650}.label{font-size:25px;font-weight:600}.small{font-size:21px;fill:var(--muted)}</style>
<rect width="1040" height="650" rx="12" fill="var(--paper)"/>
<text x="28" y="43" class="title">Double buffering：计算当前块，预取下一块</text>
<text x="28" y="83" class="small">色块表示任务；长度仅作示意，不表示实测时间。</text>
<text x="28" y="147" class="label">串行</text>
<rect x="200" y="113" width="122" height="58" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="261" y="150" text-anchor="middle">加载 0</text>
<rect x="330" y="113" width="122" height="58" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="391" y="150" text-anchor="middle">计算 0</text>
<rect x="460" y="113" width="122" height="58" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="521" y="150" text-anchor="middle">加载 1</text>
<rect x="590" y="113" width="122" height="58" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="651" y="150" text-anchor="middle">计算 1</text>
<rect x="720" y="113" width="122" height="58" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="781" y="150" text-anchor="middle">加载 2</text>
<rect x="850" y="113" width="122" height="58" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="911" y="150" text-anchor="middle">计算 2</text>
<text x="28" y="252" class="label">加载通道</text>
<text x="28" y="338" class="label">计算通道</text>
<rect x="200" y="216" width="122" height="58" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="261" y="252" text-anchor="middle">加载 0</text>
<rect x="330" y="302" width="122" height="58" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="391" y="338" text-anchor="middle">计算 0</text>
<path d="M322 245 H326 V290 H391 V302" fill="none" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="216" width="122" height="58" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="391" y="252" text-anchor="middle">加载 1</text>
<rect x="460" y="302" width="122" height="58" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="521" y="338" text-anchor="middle">计算 1</text>
<path d="M452 245 H456 V290 H521 V302" fill="none" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="460" y="216" width="122" height="58" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="521" y="252" text-anchor="middle">加载 2</text>
<rect x="590" y="302" width="122" height="58" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="651" y="338" text-anchor="middle">计算 2</text>
<path d="M582 245 H586 V290 H651 V302" fill="none" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M200 394 H984" fill="none" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrow)"/>
<text x="984" y="424" class="small" text-anchor="end">时间 →</text>
<rect x="24" y="454" width="992" height="161" rx="8" fill="var(--wash)" stroke="var(--line)" stroke-width="1.5"/>
<text x="45" y="491" class="label">两个缓冲槽循环使用</text>
<text x="45" y="534" class="small">槽 0：K tile 0 → 读完后释放 → K tile 2</text>
<text x="45" y="573" class="small">槽 1：K tile 1 → 读完后释放 → K tile 3</text>
</svg>
