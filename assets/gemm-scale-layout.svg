<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">Scale 的存储方向与读取方向</title><desc id="desc">同一 K 分组需要不同 M 行的 scales。K 连续布局中这些 scales 相隔，M 连续布局把它们放到一起。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#26364e;font-size:23px}.title{font-size:28px;font-weight:650}.label{font-size:25px;font-weight:600}.small{font-size:21px;fill:#5b6b80}</style>
<rect width="1040" height="570" rx="12" fill="white"/>
<text x="28" y="43" class="title">同一 K 分组：需要 a0、b0、c0、d0</text>
<text x="28" y="86" class="small">逻辑 SA[M,G] 不变；下面比较物理内存顺序。</text>
<text x="28" y="141" class="label">K 连续：一行的不同分组放在一起</text>
<rect x="28" y="166" width="74" height="64" rx="8" fill="#eef4fd" stroke="#285da8" stroke-width="1.5"/>
<text x="65" y="207" text-anchor="middle">a0</text>
<rect x="110" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="147" y="207" text-anchor="middle">a1</text>
<rect x="192" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="229" y="207" text-anchor="middle">a2</text>
<rect x="274" y="166" width="74" height="64" rx="8" fill="#eef4fd" stroke="#285da8" stroke-width="1.5"/>
<text x="311" y="207" text-anchor="middle">b0</text>
<rect x="356" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="393" y="207" text-anchor="middle">b1</text>
<rect x="438" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="475" y="207" text-anchor="middle">b2</text>
<rect x="520" y="166" width="74" height="64" rx="8" fill="#eef4fd" stroke="#285da8" stroke-width="1.5"/>
<text x="557" y="207" text-anchor="middle">c0</text>
<rect x="602" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="639" y="207" text-anchor="middle">c1</text>
<rect x="684" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="721" y="207" text-anchor="middle">c2</text>
<rect x="766" y="166" width="74" height="64" rx="8" fill="#eef4fd" stroke="#285da8" stroke-width="1.5"/>
<text x="803" y="207" text-anchor="middle">d0</text>
<rect x="848" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="885" y="207" text-anchor="middle">d1</text>
<rect x="930" y="166" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="967" y="207" text-anchor="middle">d2</text>
<text x="28" y="267" class="small">第 0 组所需的四个 scale，分散在四处。</text>
<path d="M520 286 V326" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="548" y="314" class="small">物理重排</text>
<text x="28" y="365" class="label">M 连续：同一分组的多行 scale 放在一起</text>
<rect x="28" y="391" width="74" height="64" rx="8" fill="#eef8f1" stroke="#328a59" stroke-width="1.5"/>
<text x="65" y="432" text-anchor="middle">a0</text>
<rect x="110" y="391" width="74" height="64" rx="8" fill="#eef8f1" stroke="#328a59" stroke-width="1.5"/>
<text x="147" y="432" text-anchor="middle">b0</text>
<rect x="192" y="391" width="74" height="64" rx="8" fill="#eef8f1" stroke="#328a59" stroke-width="1.5"/>
<text x="229" y="432" text-anchor="middle">c0</text>
<rect x="274" y="391" width="74" height="64" rx="8" fill="#eef8f1" stroke="#328a59" stroke-width="1.5"/>
<text x="311" y="432" text-anchor="middle">d0</text>
<rect x="356" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="393" y="432" text-anchor="middle">a1</text>
<rect x="438" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="475" y="432" text-anchor="middle">b1</text>
<rect x="520" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="557" y="432" text-anchor="middle">c1</text>
<rect x="602" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="639" y="432" text-anchor="middle">d1</text>
<rect x="684" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="721" y="432" text-anchor="middle">a2</text>
<rect x="766" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="803" y="432" text-anchor="middle">b2</text>
<rect x="848" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="885" y="432" text-anchor="middle">c2</text>
<rect x="930" y="391" width="74" height="64" rx="8" fill="#f6f7f9" stroke="#d4dce8" stroke-width="1.5"/>
<text x="967" y="432" text-anchor="middle">d2</text>
<text x="28" y="496" class="small">第 0 组一次读取一段连续区域；后续组也采用相同布局。</text>
<text x="28" y="538" class="small">示意省略 padding、TMA 对齐和 UE8M0 packing。</text>
</svg>
