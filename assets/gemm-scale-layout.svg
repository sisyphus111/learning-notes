<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">Scale 的存储方向与读取方向</title><desc id="desc">同一 K 分组需要不同 M 行的 scales。K 连续布局中这些 scales 相隔，M 连续布局把它们放到一起。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="var(--arrow)"/></marker></defs>
<style>/* Embedded SVGs follow the embedding page's color-scheme, including manual toggles. */
:root{--fg:#26364e;--muted:#5b6b80;--paper:white;--wash:#f8fafc;--line:#d4dce8;--blue:#285da8;--blue-bg:#eef4fd;--green:#328a59;--green-bg:#eef8f1;--orange:#d9a46e;--orange-bg:#fff6ec;--empty:#f6f7f9;--arrow:#64748b}
@media(prefers-color-scheme:dark){:root{--fg:#e8e8e8;--muted:#b6b6b6;--paper:#191919;--wash:#252525;--line:#454545;--blue:#9dc8f5;--blue-bg:#1d2936;--green:#a8d7bb;--green-bg:#1e2c24;--orange:#dfbc8c;--orange-bg:#30291e;--empty:#252525;--arrow:#a3a3a3}}
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:var(--fg);font-size:23px}.title{font-size:28px;font-weight:650}.label{font-size:25px;font-weight:600}.small{font-size:21px;fill:var(--muted)}</style>
<rect width="1040" height="570" rx="12" fill="var(--paper)"/>
<text x="28" y="43" class="title">同一 K 分组：需要 a0、b0、c0、d0</text>
<text x="28" y="86" class="small">逻辑 SA[M,G] 不变；下面比较物理内存顺序。</text>
<text x="28" y="141" class="label">K 连续：一行的不同分组放在一起</text>
<rect x="28" y="166" width="74" height="64" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="65" y="207" text-anchor="middle">a0</text>
<rect x="110" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="147" y="207" text-anchor="middle">a1</text>
<rect x="192" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="229" y="207" text-anchor="middle">a2</text>
<rect x="274" y="166" width="74" height="64" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="311" y="207" text-anchor="middle">b0</text>
<rect x="356" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="393" y="207" text-anchor="middle">b1</text>
<rect x="438" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="475" y="207" text-anchor="middle">b2</text>
<rect x="520" y="166" width="74" height="64" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="557" y="207" text-anchor="middle">c0</text>
<rect x="602" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="639" y="207" text-anchor="middle">c1</text>
<rect x="684" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="721" y="207" text-anchor="middle">c2</text>
<rect x="766" y="166" width="74" height="64" rx="8" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
<text x="803" y="207" text-anchor="middle">d0</text>
<rect x="848" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="885" y="207" text-anchor="middle">d1</text>
<rect x="930" y="166" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="967" y="207" text-anchor="middle">d2</text>
<text x="28" y="267" class="small">第 0 组所需的四个 scale，分散在四处。</text>
<path d="M520 286 V326" fill="none" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrow)"/>
<text x="548" y="314" class="small">物理重排</text>
<text x="28" y="365" class="label">M 连续：同一分组的多行 scale 放在一起</text>
<rect x="28" y="391" width="74" height="64" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="65" y="432" text-anchor="middle">a0</text>
<rect x="110" y="391" width="74" height="64" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="147" y="432" text-anchor="middle">b0</text>
<rect x="192" y="391" width="74" height="64" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="229" y="432" text-anchor="middle">c0</text>
<rect x="274" y="391" width="74" height="64" rx="8" fill="var(--green-bg)" stroke="var(--green)" stroke-width="1.5"/>
<text x="311" y="432" text-anchor="middle">d0</text>
<rect x="356" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="393" y="432" text-anchor="middle">a1</text>
<rect x="438" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="475" y="432" text-anchor="middle">b1</text>
<rect x="520" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="557" y="432" text-anchor="middle">c1</text>
<rect x="602" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="639" y="432" text-anchor="middle">d1</text>
<rect x="684" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="721" y="432" text-anchor="middle">a2</text>
<rect x="766" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="803" y="432" text-anchor="middle">b2</text>
<rect x="848" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="885" y="432" text-anchor="middle">c2</text>
<rect x="930" y="391" width="74" height="64" rx="8" fill="var(--empty)" stroke="var(--line)" stroke-width="1.5"/>
<text x="967" y="432" text-anchor="middle">d2</text>
<text x="28" y="496" class="small">第 0 组一次读取一段连续区域；后续组也采用相同布局。</text>
<text x="28" y="538" class="small">示意省略 padding、TMA 对齐和 UE8M0 packing。</text>
</svg>
